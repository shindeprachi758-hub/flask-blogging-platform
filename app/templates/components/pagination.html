{% if pagination and pagination.pages > 1 %}
<nav aria-label="Page navigation" class="mt-4 mb-5">
  <ul class="pagination justify-content-center">
    <li class="page-item {{ 'disabled' if not pagination.has_prev }}">
      <a class="page-link" href="{{ url_for(request.endpoint, page=pagination.prev_num, q=search_query, category=selected_category.id if selected_category else None, tag=selected_tag.name if selected_tag else None, sort=sort_by) if pagination.has_prev else '#' }}" aria-label="Previous">
        <span aria-hidden="true">&laquo; Previous</span>
      </a>
    </li>

    {% for p in pagination.iter_pages(left_edge=1, right_edge=1, left_current=2, right_current=2) %}
      {% if p %}
        <li class="page-item {{ 'active' if p == pagination.page }}">
          <a class="page-link" href="{{ url_for(request.endpoint, page=p, q=search_query, category=selected_category.id if selected_category else None, tag=selected_tag.name if selected_tag else None, sort=sort_by) }}">{{ p }}</a>
        </li>
      {% else %}
        <li class="page-item disabled"><span class="page-link">&hellip;</span></li>
      {% endif %}
    {% endfor %}

    <li class="page-item {{ 'disabled' if not pagination.has_next }}">
      <a class="page-link" href="{{ url_for(request.endpoint, page=pagination.next_num, q=search_query, category=selected_category.id if selected_category else None, tag=selected_tag.name if selected_tag else None, sort=sort_by) if pagination.has_next else '#' }}" aria-label="Next">
        <span aria-hidden="true">Next &raquo;</span>
      </a>
    </li>
  </ul>
</nav>
{% endif %}
