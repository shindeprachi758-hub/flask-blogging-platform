{% extends 'base.html' %}
{% block title %}500 Internal Server Error - BlogCraft{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="display-1 fw-bold text-warning mb-3">500</div>
      <h2 class="h3 fw-bold mb-3">Internal Server Error</h2>
      <p class="text-muted mb-4">An unexpected error occurred while processing your request. Our technical team has been notified.</p>
      <a href="{{ url_for('main.index') }}" class="btn btn-primary-custom">
        <i class="bi bi-arrow-clockwise me-1"></i> Return to Homepage
      </a>
    </div>
  </div>
</div>
{% endblock %}
