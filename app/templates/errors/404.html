{% extends 'base.html' %}
{% block title %}404 Not Found - BlogCraft{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="display-1 fw-bold text-primary mb-3">404</div>
      <h2 class="h3 fw-bold mb-3">Page Not Found</h2>
      <p class="text-muted mb-4">The article, category, or page you were looking for doesn't exist or has been moved.</p>
      <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('main.index') }}" class="btn btn-primary-custom">
          <i class="bi bi-house-door me-1"></i> Return Home
        </a>
        <a href="{{ url_for('posts.all_posts') }}" class="btn btn-outline-custom">
          <i class="bi bi-search me-1"></i> Browse Posts
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
